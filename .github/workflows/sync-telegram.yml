name: Sync Telegram Posts

on:
  schedule:
    # Щодня о 08:00 UTC (11:00 Київ)
    - cron: '0 8 * * *'
  # Ручний запуск з GitHub UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'

      - name: Fetch posts from Telegram
        run: python3 scripts/fetch_telegram.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.js
          if git diff --staged --quiet; then
            echo "No changes — posts.js is up to date"
          else
            git commit -m "chore: sync content $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
            echo "Pushed updated posts.js"
          fi
