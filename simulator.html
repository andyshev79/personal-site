<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Симулятор трейдингу · Андрій Шевчишин</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0A0A0A;
      --bg2: #111111;
      --gold: #F59E0B;
      --text: #F5F5F5;
      --muted: #888;
      --border: #222;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 52px;
      min-height: 52px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--gold);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border: 1px solid var(--gold);
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .back-btn:hover {
      background: var(--gold);
      color: #000;
    }
    .back-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .divider {
      width: 1px;
      height: 28px;
      background: var(--border);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
    }
    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: #000;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 13px;
      font-weight: 600;
      display: none;
    }
    @media (min-width: 480px) { .brand-name { display: block; } }

    .topbar-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    .sim-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .sim-badge {
      font-size: 10px;
      color: #22C55E;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .fullscreen-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .fullscreen-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .fullscreen-btn svg { width: 16px; height: 16px; }

    /* ── IFRAME ── */
    .sim-frame {
      flex: 1;
      border: none;
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <nav class="topbar">
    <a href="index.html" class="back-btn" title="Повернутись на сайт">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      На сайт
    </a>

    <div class="divider"></div>

    <a href="index.html" class="brand">
      <div class="brand-logo">AS</div>
      <span class="brand-name">Андрій Шевчишин</span>
    </a>

    <div class="topbar-center">
      <div class="sim-title">Симулятор трейдингу · макро-новини 2008–2025</div>
      <div class="sim-badge">● БЕЗКОШТОВНО</div>
    </div>

    <div class="topbar-actions">
      <button class="fullscreen-btn" id="fsBtn" title="Повноекранний режим">
        <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
      </button>
    </div>
  </nav>

  <iframe
    id="simFrame"
    class="sim-frame"
    src="https://macro-news-trading-simulator.vercel.app"
    allow="fullscreen"
    loading="eager"
  ></iframe>

  <script>
    const btn = document.getElementById('fsBtn');
    const frame = document.getElementById('simFrame');
    const iconExpand = `<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;
    const iconCollapse = `<polyline points="4 14 10 14 10 20"/><polyline points="20 4 14 4 14 10"/><line x1="10" y1="20" x2="3" y2="13"/><line x1="21" y1="3" x2="14" y2="10"/>`;

    btn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        frame.requestFullscreen().catch(() => {});
        btn.querySelector('svg').innerHTML = iconCollapse;
      } else {
        document.exitFullscreen();
        btn.querySelector('svg').innerHTML = iconExpand;
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        btn.querySelector('svg').innerHTML = iconExpand;
      }
    });
  </script>
</body>
</html>
